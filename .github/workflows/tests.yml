# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

# Only one run per branch at a time; cancel any in-progress run when a new one is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run unit tests (VCR cassettes, no lab connection needed)
  unit-test:
    name: Unit Tests (VCR)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.*'
          terraform_wrapper: false
      - run: go mod download
      - name: Run unit tests
        env:
          KEYFACTOR_API_PATH: "Keyfactor/API"
        run: go test -v -cover -timeout 30m -run "TestUnit" ./keyfactor/
        timeout-minutes: 25

  # Run integration tests against ses2541 lab
  integration-test:
    name: Integration Tests (ses2541 lab)
    needs: build
    runs-on: ubuntu-latest
    environment: ses2541
    timeout-minutes: 200
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.*'
          terraform_wrapper: false
      - run: go mod download
      - name: Decode K8S credentials
        run: |
          echo "${{ secrets.KEYFACTOR_K8S_SERVER_PASSWORD_B64 }}" | base64 -d > /tmp/k8s-creds.json
      - name: Run integration tests
        env:
          TF_ACC: "1"
          KEYFACTOR_HOSTNAME: ${{ secrets.KEYFACTOR_HOSTNAME }}
          KEYFACTOR_AUTH_CLIENT_ID: ${{ secrets.KEYFACTOR_AUTH_CLIENT_ID }}
          KEYFACTOR_AUTH_CLIENT_SECRET: ${{ secrets.KEYFACTOR_AUTH_CLIENT_SECRET }}
          KEYFACTOR_AUTH_TOKEN_URL: ${{ secrets.KEYFACTOR_AUTH_TOKEN_URL }}
          KEYFACTOR_SKIP_VERIFY: ${{ secrets.KEYFACTOR_SKIP_VERIFY }}
          KEYFACTOR_API_PATH: "Keyfactor/API"
          KEYFACTOR_K8S_CREDENTIALS_FILE: "/tmp/k8s-creds.json"
        run: go test -v -cover -timeout 180m -run "TestInt" ./keyfactor/
        timeout-minutes: 190
